# pytest.ini
[pytest]
python_files = *_tests.py test_*.py   # Устанавливает правила для тестовых файлов
python_classes = Test*  # Устанавливает правила для тестовых классов
python_functions = test_*  # Устанавливает правила для тестовых функций
markers=
    users: Маркировка для тестов, связанных с пользователеми.
    regression: Маркировка для регрессионных тестов.